version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      next: { patterns: ["next", "eslint-config-next", "react", "react-dom"] }
  - package-ecosystem: npm
    directory: /ui-proxy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
