version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      next: { patterns: ["next", "eslint-config-next", "react", "react-dom"] }
    ignore:
      # typescript-eslint (pulled in by eslint-config-next) rejects TypeScript 7;
      # drop this once it supports TS >= 7.1 (typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui-proxy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
