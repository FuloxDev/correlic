name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [backend, agent (Linux), agent (macOS), agent (Windows), dashboard, ui-proxy, installer / all-in-one image, docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.1, or commit hash
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the backend, agent or installer. Remove API keys and passwords.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, kernel 6.8, Docker 27 / macOS 15 / Windows 11
