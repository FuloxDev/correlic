name: Release container images

# Builds and pushes the all-in-one image plus the four component images to
# GitHub Container Registry. Runs on a version tag (v1.2.3) or on demand.
#
# GITHUB_TOKEN can only push to packages this repository owns. If a package was
# first published from another repository, grant this repository write access
# in the package's settings ("Manage Actions access") or delete the old package
# so the first push from here re-creates it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: correlic/correlic
            context: .
            dockerfile: ./Dockerfile
          - image: correlic/correlic-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: correlic/correlic-agent
            context: ./agent
            dockerfile: ./agent/Dockerfile
          - image: correlic/correlic-ui
            context: ./ui
            dockerfile: ./ui/Dockerfile
          - image: correlic/correlic-ui-proxy
            context: ./ui-proxy
            dockerfile: ./ui-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT";
          else echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
