name: Build Linux bundle

# Produces the self-contained Linux install bundles (tar.gz), .deb and .rpm
# packages and an apt/yum repository tree for linux/amd64 and linux/arm64.
# Everything is built from this repository on one x86_64 runner: Go
# cross-compiles, one `go generate` emits the eBPF objects for both
# architectures, the dashboard and proxy are architecture-independent
# JavaScript, and the portable Node.js runtime is downloaded per
# architecture. Artifacts are attached to the GitHub Release for the version.
#
# Asset names: the amd64 assets keep their historical names
# (correlic-linux-<v>.tar.gz, correlic_<v>_amd64.deb, correlic-<v>-1.x86_64.rpm);
# the arm64 ones are correlic-linux-<v>-arm64.tar.gz, correlic_<v>_arm64.deb
# and correlic-<v>-1.aarch64.rpm. SHA256SUMS-linux.txt covers all of them.
#
# Supply chain (see SECURITY.md "Verifying a release" and
# backend/docs/RELEASE_PROCESS.md): every tar.gz, .deb, .rpm and the
# SHA256SUMS file is signed with Sigstore keyless signing (cosign sign-blob;
# the certificate identity is this workflow file, the issuer GitHub's OIDC
# provider, the signature is in the public Rekor log) and the bundle
# `<asset>.sigstore.json` is published next to the asset. syft writes an SPDX
# SBOM `<asset>.spdx.json` of each bundle and package tree; the SBOMs are
# listed in SHA256SUMS-linux.txt, so the signed checksum file covers them.
# The optional GPG signing of .deb/.rpm (GPG_PRIVATE_KEY secret) is unchanged.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

env:
  NODE_VERSION: "24.21.0"
  # Go architecture names to build for. nfpm maps them to the deb
  # (amd64/arm64) and rpm (x86_64/aarch64) architecture names itself.
  ARCHES: "amd64 arm64"

permissions:
  contents: write  # attach assets to the draft release
  id-token: write  # Sigstore keyless signing (OIDC token for Fulcio)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "bare=${V#v}" >> "$GITHUB_OUTPUT"

      # ── Go binaries (one set per architecture, under build/<arch>/) ──
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-headers-generic

      - name: Build backend binaries
        working-directory: backend
        env: { GOOS: linux, CGO_ENABLED: '0' }
        run: |
          LD="-s -w -X main.version=${{ steps.v.outputs.version }}"
          for ARCH in $ARCHES; do
            mkdir -p ../build/$ARCH
            GOARCH=$ARCH go build -ldflags="$LD" -o ../build/$ARCH/correlic-api ./cmd/api
            GOARCH=$ARCH go build -ldflags="$LD" -o ../build/$ARCH/correlic-telemetry ./cmd/telemetry
            GOARCH=$ARCH go build -ldflags="$LD" -o ../build/$ARCH/correlic-admin ./cmd/admin
            GOARCH=$ARCH go build -ldflags="$LD" -o ../build/$ARCH/correlic-mcp ./cmd/mcp
          done

      - name: Build agent
        working-directory: agent
        run: |
          # One go generate emits the eBPF objects for amd64 and arm64;
          # GOARCH selects the matching set for each binary.
          go generate ./internal/ebpf/...
          for ARCH in $ARCHES; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -ldflags="-s -w -X main.version=${{ steps.v.outputs.version }}" -o ../build/$ARCH/correlic-agent ./cmd/agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -ldflags="-s -w -X main.version=${{ steps.v.outputs.version }}" -o ../build/$ARCH/correlic-hook ./cmd/correlic-hook
          done

      # ── UI + proxy (built here, not downloaded; pure JavaScript, shared by both architectures) ──
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui-proxy/package-lock.json

      - name: Build dashboard (standalone)
        working-directory: ui
        env: { NEXT_TELEMETRY_DISABLED: "1" }
        run: |
          npm ci
          npm run build
          mkdir -p ../build/ui/.next
          cp -r .next/standalone/. ../build/ui/
          cp -r .next/static ../build/ui/.next/static
          cp -r public ../build/ui/public

      - name: Build ui-proxy
        working-directory: ui-proxy
        run: |
          npm ci --omit=dev
          mkdir -p ../build/ui-proxy
          cp -r index.js package.json package-lock.json node_modules ../build/ui-proxy/

      - name: Download portable Node.js runtime (linux-x64 + linux-arm64)
        run: |
          for ARCH in $ARCHES; do
            case "$ARCH" in
              amd64) NODE_ARCH=x64 ;;
              arm64) NODE_ARCH=arm64 ;;
              *) echo "no portable Node.js mapping for $ARCH" >&2; exit 1 ;;
            esac
            DIR="node-v${NODE_VERSION}-linux-${NODE_ARCH}"
            curl -sSL --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${DIR}.tar.xz" -o node.tar.xz
            tar -xJf node.tar.xz
            mkdir -p build/$ARCH/node
            mv "$DIR"/* build/$ARCH/node/
            rm -rf node.tar.xz "$DIR" build/$ARCH/node/include build/$ARCH/node/share build/$ARCH/node/CHANGELOG.md build/$ARCH/node/README.md build/$ARCH/node/LICENSE build/$ARCH/node/lib build/$ARCH/node/bin/npm build/$ARCH/node/bin/npx build/$ARCH/node/bin/corepack
          done

      # ── Packages (one .deb + .rpm per architecture) ────────────
      - name: Install nfpm
        run: |
          curl -fsSL --retry 3 -o /tmp/nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.46.0/nfpm_2.46.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

      # syft (via the anchore/sbom-action installer) writes the SPDX SBOMs.
      # Pinned to a release tag for now; a candidate for SHA pinning once the
      # Scorecard workflow is green.
      - uses: anchore/sbom-action/download-syft@v0
        id: syft

      - name: Build .deb and .rpm
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          # nfpm resolves `src:` paths against the working directory, so the
          # package filesystem is assembled in pkg/ once per architecture and
          # the config gets ${VERSION} and ${ARCH} substituted each round.
          for ARCH in $ARCHES; do
            rm -rf pkg
            mkdir -p pkg/usr/bin pkg/etc/correlic pkg/usr/share/correlic pkg/var/lib/correlic/certs pkg/var/log/correlic pkg/lib/systemd/system
            cp build/$ARCH/correlic-api build/$ARCH/correlic-telemetry build/$ARCH/correlic-admin build/$ARCH/correlic-agent pkg/usr/bin/
            cp build/$ARCH/correlic-hook pkg/usr/bin/
            cp build/$ARCH/correlic-mcp pkg/usr/bin/
            chmod 755 pkg/usr/bin/*
            cp install/gen-certs.sh pkg/etc/correlic/gen-certs.sh && chmod 755 pkg/etc/correlic/gen-certs.sh
            cp -r backend/migrations pkg/usr/share/correlic/migrations
            cp -r build/$ARCH/node pkg/usr/share/correlic/node
            cp -r build/ui pkg/usr/share/correlic/ui
            cp -r build/ui-proxy pkg/usr/share/correlic/ui-proxy
            cp install/linux/systemd/*.service pkg/lib/systemd/system/
            sed -e "s/\${VERSION}/${{ steps.v.outputs.bare }}/" -e "s/\${ARCH}/$ARCH/" install/linux/nfpm.yml > nfpm.yml
            nfpm package -p deb -f nfpm.yml -t .
            nfpm package -p rpm -f nfpm.yml -t .
            # One SPDX SBOM of the package tree, named after the .deb and the
            # .rpm it became (nfpm's default file names; checked, so a naming
            # change here fails the build instead of producing orphan SBOMs).
            case "$ARCH" in amd64) RPMARCH=x86_64 ;; arm64) RPMARCH=aarch64 ;; *) echo "no rpm arch for $ARCH" >&2; exit 1 ;; esac
            DEB="correlic_${{ steps.v.outputs.bare }}_${ARCH}.deb"
            RPM="correlic-${{ steps.v.outputs.bare }}-1.${RPMARCH}.rpm"
            [ -f "$DEB" ] && [ -f "$RPM" ] || { echo "expected $DEB and $RPM" >&2; ls -l; exit 1; }
            "$SYFT" scan dir:pkg --source-name correlic --source-version "${{ steps.v.outputs.bare }}" \
              -o "spdx-json=${DEB}.spdx.json"
            cp "${DEB}.spdx.json" "${RPM}.spdx.json"
          done
          ls -l correlic_*.deb correlic-*.rpm ./*.spdx.json

      - name: Build tar.gz bundles
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for ARCH in $ARCHES; do
            rm -rf bundle
            mkdir -p bundle/bin bundle/certs bundle/logs
            cp build/$ARCH/correlic-api build/$ARCH/correlic-telemetry build/$ARCH/correlic-admin build/$ARCH/correlic-agent bundle/bin/
            cp build/$ARCH/correlic-hook bundle/bin/
            cp build/$ARCH/correlic-mcp bundle/bin/
            cp -r build/$ARCH/node bundle/node
            cp -r build/ui bundle/ui
            cp -r build/ui-proxy bundle/ui-proxy
            cp -r backend/migrations bundle/migrations
            cp install/install.sh install/uninstall.sh install/gen-certs.sh bundle/
            chmod +x bundle/*.sh
            # amd64 keeps the historical asset name; other architectures carry a suffix
            SUFFIX=""; [ "$ARCH" = amd64 ] || SUFFIX="-$ARCH"
            tar -czf "correlic-linux-${{ steps.v.outputs.version }}${SUFFIX}.tar.gz" -C bundle .
            "$SYFT" scan dir:bundle --source-name correlic-linux --source-version "${{ steps.v.outputs.version }}" \
              -o "spdx-json=correlic-linux-${{ steps.v.outputs.version }}${SUFFIX}.tar.gz.spdx.json"
          done
          ls -l correlic-linux-*.tar.gz correlic-linux-*.spdx.json

      # ── Optional package signing (only if a key is configured) ─
      - name: Sign packages
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --keyid-format short 2>/dev/null | grep -oP '[A-F0-9]{8,}' | head -1)
          sudo apt-get install -y -qq dpkg-sig rpm 2>/dev/null || true
          dpkg-sig -k "$GPG_KEY_ID" -s builder correlic_*.deb 2>/dev/null || true
          rpm --addsign correlic-*.rpm 2>/dev/null || true
          gpg --export --armor > correlic.gpg.key

      - name: Build apt and yum repository trees (amd64 + arm64)
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c 2>/dev/null || true
          mkdir -p repo/apt/pool/main repo/apt/dists/stable/main/binary-amd64 repo/apt/dists/stable/main/binary-arm64 repo/yum/el/9/x86_64 repo/yum/el/9/aarch64
          cp correlic_*.deb repo/apt/pool/main/
          (cd repo/apt \
            && dpkg-scanpackages --arch amd64 pool/ /dev/null > dists/stable/main/binary-amd64/Packages && gzip -k dists/stable/main/binary-amd64/Packages \
            && dpkg-scanpackages --arch arm64 pool/ /dev/null > dists/stable/main/binary-arm64/Packages && gzip -k dists/stable/main/binary-arm64/Packages \
            && apt-ftparchive -o APT::FTPArchive::Release::Architectures="amd64 arm64" release dists/stable > dists/stable/Release 2>/dev/null || true)
          cp correlic-*.x86_64.rpm repo/yum/el/9/x86_64/
          cp correlic-*.aarch64.rpm repo/yum/el/9/aarch64/
          createrepo_c repo/yum/el/9/x86_64/ 2>/dev/null || true
          createrepo_c repo/yum/el/9/aarch64/ 2>/dev/null || true
          [ -f correlic.gpg.key ] && cp correlic.gpg.key repo/ || true
          tar -czf correlic-linux-repo-${{ steps.v.outputs.version }}.tar.gz repo

      # The checksum file lists every asset including the SBOMs; it is signed
      # below, so verifying SHA256SUMS-linux.txt covers the SBOMs as well.
      - name: Checksums
        run: sha256sum correlic-linux-${{ steps.v.outputs.version }}.tar.gz correlic-linux-${{ steps.v.outputs.version }}-arm64.tar.gz correlic-linux-repo-${{ steps.v.outputs.version }}.tar.gz correlic_*.deb correlic-*.rpm *.spdx.json > SHA256SUMS-linux.txt

      # ── Sigstore keyless signatures (cosign) ───────────────────
      # Candidate for SHA pinning once the Scorecard workflow is green.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign assets and checksums (cosign sign-blob)
        run: |
          for f in correlic-linux-*.tar.gz correlic_*.deb correlic-*.rpm SHA256SUMS-linux.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l ./*.sigstore.json

      # Fail here, not on a user's machine. The identity is this workflow
      # file; the issuer is GitHub's OIDC provider.
      - name: Verify the signatures
        env:
          IDENTITY_RE: ^https://github.com/${{ github.repository }}/\.github/workflows/build-linux-bundle\.yml@
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          for f in correlic-linux-*.tar.gz correlic_*.deb correlic-*.rpm SHA256SUMS-linux.txt; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "$IDENTITY_RE" \
              --certificate-oidc-issuer "$ISSUER" "$f"
          done
          sha256sum -c SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v6
        with:
          name: correlic-linux-${{ steps.v.outputs.version }}
          path: |
            correlic-linux-${{ steps.v.outputs.version }}.tar.gz
            correlic-linux-${{ steps.v.outputs.version }}-arm64.tar.gz
            correlic-linux-repo-${{ steps.v.outputs.version }}.tar.gz
            correlic_*.deb
            correlic-*.rpm
            SHA256SUMS-linux.txt
            *.sigstore.json
            *.spdx.json
          retention-days: 14

      # Runs for tag pushes and manual dispatches alike. With an explicit tag_name
      # the release API creates the tag at this commit if it does not exist yet.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            correlic-linux-${{ steps.v.outputs.version }}.tar.gz
            correlic-linux-${{ steps.v.outputs.version }}-arm64.tar.gz
            correlic-linux-repo-${{ steps.v.outputs.version }}.tar.gz
            correlic_*.deb
            correlic-*.rpm
            SHA256SUMS-linux.txt
            *.sigstore.json
            *.spdx.json
