name: Build and Push All-in-One Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: true
      backend_ref:
        description: 'correlic-backend branch/tag/sha'
        required: false
        default: 'main'
      agent_ref:
        description: 'Correlic-agent branch/tag/sha'
        required: false
        default: 'main'
      ui_ref:
        description: 'correlic-ui branch/tag/sha'
        required: false
        default: 'main'
      proxy_ref:
        description: 'correlic-ui-proxy branch/tag/sha'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: correlic/correlic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout correlic-backend
        uses: actions/checkout@v4
        with:
          repository: Correlic/correlic-backend
          ref: ${{ inputs.backend_ref }}
          path: src/correlic-backend
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Checkout Correlic-agent
        uses: actions/checkout@v4
        with:
          repository: Correlic/Correlic-agent
          ref: ${{ inputs.agent_ref }}
          path: src/Correlic-agent
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Checkout correlic-ui
        uses: actions/checkout@v4
        with:
          repository: Correlic/correlic-ui
          ref: ${{ inputs.ui_ref }}
          path: src/correlic-ui
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Checkout correlic-ui-proxy
        uses: actions/checkout@v4
        with:
          repository: Correlic/correlix-ui-proxy
          ref: ${{ inputs.proxy_ref }}
          path: src/correlic-ui-proxy
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
