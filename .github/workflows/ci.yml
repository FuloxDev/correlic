name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Pinned: staticcheck 2026.1 (v0.8.1) matches the Go 1.26 toolchain in
      # go.mod. @latest can require a newer Go than go.mod and, with
      # GOTOOLCHAIN=auto, download one on every run; that fails whenever the
      # newest patch is not yet in the Go sum database.
      - run: GOTOOLCHAIN=local go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test ./...

  agent:
    name: agent (go + eBPF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-headers-generic
      - name: Generate eBPF objects
        run: go generate ./internal/ebpf/...
      - name: Build (linux, darwin, windows)
        run: |
          GOOS=linux  GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
      - run: go vet ./...
      - run: go test ./...

  agent-macos:
    name: agent (macOS kqueue + Endpoint Security build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go build ./... && go vet ./...
      - run: go test ./...
      # The Endpoint Security bindings need cgo and the macOS SDK, so this is
      # the only job that compiles them. Running them needs the entitlement.
      # SDKROOT points clang at the SDK; without it the link step cannot find
      # EndpointSecurity.framework (shipped as a .tbd stub in the SDK).
      - name: Build with Endpoint Security (-tags esf)
        env: { CGO_ENABLED: '1' }
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          go build -tags esf ./... && go vet -tags esf ./...

  ui:
    name: ui (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ui-proxy:
    name: ui-proxy (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-proxy/package-lock.json
      - run: npm ci
      - run: node --check index.js
