name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Pinned: staticcheck 2026.1 (v0.8.1) matches the Go 1.26 toolchain in
      # go.mod. @latest can require a newer Go than go.mod and, with
      # GOTOOLCHAIN=auto, download one on every run; that fails whenever the
      # newest patch is not yet in the Go sum database.
      - run: GOTOOLCHAIN=local go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test ./...

  agent:
    name: agent (go + eBPF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: agent/go.sum
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-headers-generic
      - name: Generate eBPF objects
        run: go generate ./internal/ebpf/...
      - name: Build (linux, darwin, windows)
        run: |
          GOOS=linux  GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
      - run: go vet ./...
      - run: go test ./...

  agent-linux-arm64:
    name: agent (go + eBPF, linux/arm64)
    # Mirrors the `agent` job on GitHub's arm64 runner (free for public
    # repositories) and, in addition, loads the arm64 eBPF objects into the
    # runner's arm64 kernel, which exercises CO-RE relocation and the verifier
    # for that architecture.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: agent/go.sum
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-headers-generic
      - name: Generate eBPF objects
        run: go generate ./internal/ebpf/...
      - name: Build (linux/arm64)
        run: |
          uname -m
          GOOS=linux GOARCH=arm64 go build ./...
      - run: go vet ./...
      - run: go test ./...
      # `go test` above runs unprivileged, so TestLoadBPFObjects skips there.
      # Run it as root to load every arm64 object into the arm64 kernel.
      # CORRELIC_BPF_LOAD_REQUIRED turns the test's skips (no BTF, no memlock,
      # no CAP_BPF) into failures so a silent skip cannot pass as a check.
      - name: Load eBPF objects into the arm64 kernel
        run: |
          uname -r
          ls -l /sys/kernel/btf/vmlinux
          sudo -E env "PATH=$PATH" GOTOOLCHAIN=local CORRELIC_BPF_LOAD_REQUIRED=1 go test ./internal/ebpf/ -run TestLoadBPFObjects -v

  agent-macos:
    name: agent (macOS kqueue + Endpoint Security build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: agent/go.sum
      - run: go build ./... && go vet ./...
      - run: go test ./...
      # The Endpoint Security bindings need cgo and the macOS SDK, so this is
      # the only job that compiles them (a compile check only: running them
      # needs an entitlement the project does not hold). SDKROOT points clang
      # at the SDK headers.
      - name: Build with Endpoint Security (-tags esf)
        env: { CGO_ENABLED: '1' }
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          go build -tags esf ./... && go vet -tags esf ./...

  ui:
    name: ui (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ui-proxy:
    name: ui-proxy (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-proxy/package-lock.json
      - run: npm ci
      - run: node --check index.js
