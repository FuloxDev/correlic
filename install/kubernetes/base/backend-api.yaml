# API plane (cmd/api): dashboard and agent control endpoints on :8080.
# Requires a client certificate on every TLS handshake, so the kubelet
# cannot do an HTTPS GET on /health here (it has no client certificate);
# the probes are TCP. The telemetry plane's /health is probed over HTTPS.
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  labels:
    app.kubernetes.io/name: backend-api
spec:
  selector:
    app.kubernetes.io/name: backend-api
  ports:
    - name: https
      port: 8080
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  labels:
    app.kubernetes.io/name: backend-api
spec:
  replicas: 1
  strategy:
    type: Recreate   # the certs volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-api
        correlic.io/certs: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  correlic.io/certs: "true"
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/fuloxdev/correlic-backend:v1.0.1
          args: ["api"]
          envFrom:
            - configMapRef:
                name: correlic-config
            - secretRef:
                name: correlic-secrets
          env:
            - name: LISTEN_ADDR
              value: ":8080"
          ports:
            - name: https
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: correlic-certs
