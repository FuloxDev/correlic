# Copy this file to secret.yaml (git-ignored), replace every value, then
# apply the kustomization. Values are given as stringData so they can be
# typed in plain text; Kubernetes stores them base64-encoded. Generate
# random values with: openssl rand -hex 32
#
# Not in here on purpose: the dashboard login (API key + admin password) and
# the agent's API key. The bootstrap Job creates them on the first apply,
# prints them in its logs and stores them in the certs volume
# (dashboard-credentials, agent.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: correlic-secrets
type: Opaque
stringData:
  # PostgreSQL superuser password of the bundled StatefulSet (postgres.yaml).
  POSTGRES_PASSWORD: "change-me"
  # Connection string used by both backend planes and the bootstrap Job.
  # Keep the password in sync with POSTGRES_PASSWORD. For a managed database
  # point this at it and use sslmode=require.
  DATABASE_URL: "postgres://correlic:change-me@postgres:5432/correlic?sslmode=disable"
  # Encrypts stored LLM provider keys (BYOK). Changing it later makes the
  # stored provider settings unreadable.
  LLM_ENCRYPTION_KEY: "change-me"
  # ── overlays/graph only (ignored by the PostgreSQL-only base) ──────────
  # NEO4J_AUTH is what the Neo4j image expects: "neo4j/<NEO4J_PASSWORD>".
  # Neo4j rejects passwords shorter than 8 characters.
  NEO4J_PASSWORD: "change-me-graph"
  NEO4J_AUTH: "neo4j/change-me-graph"
