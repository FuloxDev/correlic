# Ingress example — not part of the kustomization. Copy it, set the host and
# the TLS secret (cert-manager or your own certificate), then either add it to
# kustomization.yaml or `kubectl -n correlic apply -f ingress.yaml`.
#
# TLS terminates here and the Ingress forwards to the dashboard (ui) only.
# The backend planes stay ClusterIP services behind mTLS and are never
# exposed through the Ingress; see backend-external.example.yaml for agents
# that run outside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: correlic
  annotations:
    # ingress-nginx: the AI explain/chat endpoints stream for up to 3 minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    # cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - correlic.example.com
      secretName: correlic-tls
  rules:
    - host: correlic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3001
