# Correlic — self-hosted security observability for AI coding agents
# All data stays on your machine. Nothing is sent anywhere else.
#
# Usage (PostgreSQL only — the default profile):
#   cp .env.example .env            # fill in DB_PASSWORD and LLM_ENCRYPTION_KEY
#   docker compose up -d
#   docker compose logs bootstrap   # shows the dashboard login (API key, admin password) on first start
#   open http://localhost:3001
#
# Usage (PostgreSQL + Neo4j — the optional "graph" profile):
#   Set NEO4J_URI=bolt://neo4j:7687 and NEO4J_PASSWORD in .env, then start
#   with the profile on every invocation:
#   docker compose --profile graph up -d
#   docker compose --profile graph down
#   (or export COMPOSE_PROFILES=graph once and use plain `docker compose`).
#
# Neo4j is an opt-in upgrade. Everything — ingestion, sampling, every
# detection rule except the two graph look-back rules (ai.data_exfiltration,
# ai.excessive_writes), incidents, baselines, block rules, notifications, the
# dashboard and the AI chat — runs on PostgreSQL alone. The graph adds those
# two rules, the Neo4j process-tree/attack-path timeline (/neo4j/*,
# /processes/*) and graph-backed investigation. See
# backend/docs/CORRELATION_ENGINE.md ("What needs the graph").
#
# Images are pinned to the v1.0.1 release (https://github.com/FuloxDev/correlic/releases/tag/v1.0.1);
# the `latest` tag tracks the newest release.
#
# The bootstrap service creates the organisation, a dashboard admin (API key
# and email/password) and a separate, restricted key for the agent. The
# credentials are also stored in the correlic-certs volume as
# dashboard-credentials. The dashboard port is bound to 127.0.0.1; change the
# `ports:` entry of the ui service to expose it on the network.

services:
  # ── Init: generate mTLS certs (first run only) ───────────
  init-certs:
    image: alpine:3.20
    command: >
      sh -c '
        if [ -f /certs/ca.crt ]; then
          echo "Certs already exist, skipping"
          exit 0
        fi
        apk add --no-cache openssl > /dev/null 2>&1
        echo "Generating mTLS certificates..."
        openssl genrsa -out /certs/ca.key 4096 2>/dev/null
        openssl req -new -x509 -days 3650 -key /certs/ca.key -out /certs/ca.crt -subj "/CN=Correlic CA" 2>/dev/null
        openssl genrsa -out /certs/server.key 2048 2>/dev/null
        openssl req -new -key /certs/server.key -out /certs/server.csr -subj "/CN=correlic-backend" 2>/dev/null
        printf "authorityKeyIdentifier=keyid,issuer\nbasicConstraints=CA:FALSE\nsubjectAltName=DNS:localhost,DNS:backend-api,DNS:backend-tel,IP:127.0.0.1" > /certs/ext.cnf
        openssl x509 -req -in /certs/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -out /certs/server.crt -days 3650 -extfile /certs/ext.cnf 2>/dev/null
        openssl genrsa -out /certs/client.key 2048 2>/dev/null
        openssl req -new -key /certs/client.key -out /certs/client.csr -subj "/CN=correlic-agent" 2>/dev/null
        openssl x509 -req -in /certs/client.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -out /certs/client.crt -days 3650 2>/dev/null
        rm -f /certs/*.csr /certs/*.cnf /certs/*.srl
        chmod 644 /certs/*.crt /certs/*.key
        echo "Certificates generated successfully"
      '
    volumes:
      - correlic-certs:/certs

  # ── Bootstrap: migrations + org + admin + agent key + agent config (first run)
  bootstrap:
    image: ghcr.io/fuloxdev/correlic-backend:v1.0.1
    entrypoint: [""]
    command: >
      sh -c '
        kv() { grep -E "^[[:space:]]*$$1=" | head -1 | sed -E "s/^[[:space:]]*$$1=//" | tr -d "[:space:]"; }
        if [ -f /certs/.bootstrapped ]; then
          echo "Already bootstrapped, running migrations only..."
          /app/admin migrate up
          exit 0
        fi
        echo "Running bootstrap..."
        /app/admin migrate up
        ORG_ID=$$(/app/admin create-org --name "Default" 2>&1 | tee /dev/stderr | kv org_id)
        if [ -z "$$ORG_ID" ] && [ -f /certs/.org_id ]; then ORG_ID=$$(cat /certs/.org_id); fi
        if [ -z "$$ORG_ID" ]; then echo "ERROR: could not create or find the organization"; exit 1; fi
        echo "$$ORG_ID" > /certs/.org_id
        /app/admin enroll-client-cert --org-id "$$ORG_ID" --name agent-cert --cert-file /certs/client.crt 2>&1 || true
        ADMIN_OUT=$$(/app/admin create-user --org-id "$$ORG_ID" --email admin@local.dev --name "Admin" --role admin 2>&1)
        ADMIN_ID=$$(echo "$$ADMIN_OUT" | kv user_id); ADMIN_PASSWORD=$$(echo "$$ADMIN_OUT" | kv password)
        DASHBOARD_KEY=$$(/app/admin create-api-key --org-id "$$ORG_ID" --user-id "$$ADMIN_ID" --name dashboard 2>&1 | kv api_key)
        AGENT_USER=$$(/app/admin create-service-account --org-id "$$ORG_ID" --email agent@local.dev --name "Agent" --role member 2>&1 | kv user_id)
        AGENT_KEY=$$(/app/admin create-api-key --org-id "$$ORG_ID" --user-id "$$AGENT_USER" --name agent --type agent 2>&1 | kv api_key)
        if [ -z "$$DASHBOARD_KEY" ] || [ -z "$$AGENT_KEY" ]; then echo "ERROR: could not create API keys (see output above)"; exit 1; fi
        printf "backend_url: \"https://backend-api:8080\"\ntelemetry_url: \"https://backend-tel:8081\"\napi_key: \"$$AGENT_KEY\"\ntls_ca_file: \"/certs/ca.crt\"\ntls_client_cert_file: \"/certs/client.crt\"\ntls_client_key_file: \"/certs/client.key\"\nprofile: \"developer\"\nlog_level: \"info\"\nheartbeat_interval: 30s\nebpf_enabled: true\nprocess_exec_enabled: true\nfile_monitor_enabled: true\nnetwork_monitor_enabled: true\ndns_monitor_enabled: true\n" > /certs/agent.yaml
        chmod 600 /certs/agent.yaml
        printf "DASHBOARD_URL=http://localhost:3001\nAPI_KEY=%s\nADMIN_EMAIL=admin@local.dev\nADMIN_PASSWORD=%s\n" "$$DASHBOARD_KEY" "$$ADMIN_PASSWORD" > /certs/dashboard-credentials
        chmod 600 /certs/dashboard-credentials
        touch /certs/.bootstrapped
        echo ""
        echo "============================================"
        echo "  Correlic ready!"
        echo "  Dashboard: http://localhost:3001"
        echo "  Org ID:    $$ORG_ID"
        echo ""
        echo "  Log in with the API key:"
        echo "    $$DASHBOARD_KEY"
        echo "  or with admin@local.dev / $$ADMIN_PASSWORD"
        echo "  (also stored in the correlic-certs volume as dashboard-credentials)"
        echo "============================================"
      '
    environment:
      DATABASE_URL: postgres://correlic:${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}@db:5432/correlic?sslmode=disable
    volumes:
      - correlic-certs:/certs
    depends_on:
      db:
        condition: service_healthy
      init-certs:
        condition: service_completed_successfully
    networks:
      - correlic

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    volumes:
      - correlic-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: correlic
      POSTGRES_USER: correlic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U correlic"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - correlic

  # ── Neo4j (optional, profile "graph") ─────────────────────
  # Only started with `docker compose --profile graph up -d`. The backend
  # planes connect to it when NEO4J_URI=bolt://neo4j:7687 is set in .env.
  # Compose interpolates every service before applying profiles, so the
  # password cannot be declared required here: with the profile on and
  # NEO4J_PASSWORD empty, Neo4j itself refuses to start (minimum password
  # length) — check `docker compose logs neo4j`.
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    volumes:
      - correlic-neo4j:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '[]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - correlic

  # ── Backend API ───────────────────────────────────────────
  backend-api:
    image: ghcr.io/fuloxdev/correlic-backend:v1.0.1
    command: ["api"]
    environment:
      DATABASE_URL: postgres://correlic:${DB_PASSWORD}@db:5432/correlic?sslmode=disable
      ALLOW_API_KEY_AUTH: "true"
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-default}
      # Empty NEO4J_URI = no graph (PostgreSQL only). Set it in .env together
      # with the "graph" profile to enable Neo4j.
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
      MTLS_CA_FILE: /certs/ca.crt
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:?Set LLM_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      SAMPLING_ENABLED: "true"
    volumes:
      - correlic-certs:/certs
    # No depends_on for neo4j: the planes start without it and connect lazily
    # when NEO4J_URI is set (a failed connection logs a warning and runs
    # without the graph).
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - correlic

  # ── Backend Telemetry ─────────────────────────────────────
  backend-tel:
    image: ghcr.io/fuloxdev/correlic-backend:v1.0.1
    command: ["telemetry"]
    environment:
      DATABASE_URL: postgres://correlic:${DB_PASSWORD}@db:5432/correlic?sslmode=disable
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
      MTLS_CA_FILE: /certs/ca.crt
      SAMPLING_ENABLED: "true"
      ALLOW_API_KEY_AUTH: "true"
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-default}
    volumes:
      - correlic-certs:/certs
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - correlic

  # ── eBPF Agent ────────────────────────────────────────────
  agent:
    image: ghcr.io/fuloxdev/correlic-agent:v1.0.1
    privileged: true
    pid: host
    entrypoint: [""]
    command: >
      sh -c '
        echo "Waiting 15s for backend API to be ready..."
        sleep 15
        echo "Starting agent"
        exec /app/correlic-agent
      '
    environment:
      CORRELIC_CONFIG: /certs/agent.yaml
    volumes:
      - correlic-certs:/certs
      - /sys/kernel:/sys/kernel:ro
      - /proc:/host/proc:ro
    depends_on:
      - backend-api
      - backend-tel
    restart: unless-stopped
    networks:
      - correlic

  # ── UI Dashboard ──────────────────────────────────────────
  # Log in with the API key or admin password printed by the bootstrap service.
  # Bound to 127.0.0.1 by default; use "3001:3001" to expose it on the network.
  ui:
    image: ghcr.io/fuloxdev/correlic-ui:v1.0.1
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PROXY_BASE_URL: http://ui-proxy:8788
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    depends_on:
      - backend-api
      - bootstrap
    restart: unless-stopped
    networks:
      - correlic

  # ── UI Proxy (mTLS handler — internal only) ──────────────
  ui-proxy:
    image: ghcr.io/fuloxdev/correlic-ui-proxy:v1.0.1
    environment:
      PORT: 8788
      BIND_HOST: 0.0.0.0
      NODE_ENV: production
      BACKEND_API: https://backend-api:8080
      ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      MTLS_CA: /certs/ca.crt
      MTLS_CERT: /certs/client.crt
      MTLS_KEY: /certs/client.key
    volumes:
      - correlic-certs:/certs:ro
    depends_on:
      - ui
      - backend-api
      - bootstrap
    restart: unless-stopped
    networks:
      - correlic

volumes:
  correlic-pgdata:
  correlic-neo4j:   # only used by the "graph" profile
  correlic-certs:

networks:
  correlic:
    driver: bridge
