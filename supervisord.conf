[supervisord]
nodaemon=true
logfile=/var/log/correlic/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/correlic

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── PostgreSQL ──────────────────────────────────────────────
[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/correlic/postgresql
user=postgres
autostart=true
autorestart=true
priority=10
stopwaitsecs=30
stdout_logfile=/var/log/correlic/postgresql.log
stderr_logfile=/var/log/correlic/postgresql-error.log

# ── Neo4j ───────────────────────────────────────────────────
[program:neo4j]
command=/usr/bin/neo4j console
autostart=true
autorestart=true
priority=20
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/correlic/neo4j.log
stderr_logfile=/var/log/correlic/neo4j-error.log

# ── Backend API ─────────────────────────────────────────────
# Inherits DATABASE_URL, NEO4J_*, TLS_*, DEFAULT_ORG_ID etc from entrypoint exports
[program:backend-api]
command=/opt/correlic/bin/correlic-api
autostart=false
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/correlic/backend-api.log
stderr_logfile=/var/log/correlic/backend-api-error.log

# ── Backend Telemetry ───────────────────────────────────────
[program:backend-telemetry]
command=/opt/correlic/bin/correlic-telemetry
autostart=false
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/correlic/backend-telemetry.log
stderr_logfile=/var/log/correlic/backend-telemetry-error.log

# ── eBPF Agent ──────────────────────────────────────────────
# Reads config from CORRELIC_CONFIG yaml file (set by entrypoint)
[program:agent]
command=/opt/correlic/bin/correlic-agent
autostart=false
autorestart=true
priority=40
startsecs=10
stdout_logfile=/var/log/correlic/agent.log
stderr_logfile=/var/log/correlic/agent-error.log

# ── UI (Next.js Dashboard) ─────────────────────────────────
# API_KEY inherited from entrypoint for auto-login session management
[program:ui]
command=node /opt/correlic/ui/server.js
autostart=false
autorestart=true
priority=50
startsecs=5
environment=PORT="3001",HOSTNAME="0.0.0.0",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",PROXY_BASE_URL="http://127.0.0.1:8788"
stdout_logfile=/var/log/correlic/ui.log
stderr_logfile=/var/log/correlic/ui-error.log

# ── UI Proxy (mTLS handler) ────────────────────────────────
# API_KEY inherited from entrypoint for auth fallback
[program:ui-proxy]
command=node /opt/correlic/ui-proxy/index.js
directory=/opt/correlic/ui-proxy
autostart=false
autorestart=true
priority=50
startsecs=3
environment=PORT="8788",BACKEND_API="https://localhost:8080",MTLS_CA="/opt/correlic/certs/ca.crt",MTLS_CERT="/opt/correlic/certs/client.crt",MTLS_KEY="/opt/correlic/certs/client.key"
stdout_logfile=/var/log/correlic/ui-proxy.log
stderr_logfile=/var/log/correlic/ui-proxy-error.log
